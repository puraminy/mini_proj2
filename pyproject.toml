[project]
name = "mini-proj2-api"
version = "0.1.0"
description = "Maintainable FastAPI service with SQLModel-backed group role APIs."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "sqlmodel>=0.0.16",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
